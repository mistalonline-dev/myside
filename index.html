<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image with 3 Animations</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
        }

        .image-container {
            position: relative;
            animation: float 3s ease-in-out infinite,
                       rotate 6s linear infinite,
                       glow 2s ease-in-out infinite alternate;
        }

        .image-container img {
            width: 300px;
            height: 300px;
            object-fit: cover;
            border-radius: 20px;
            display: block;
        }

        /* Animation 1: Float (up-down movement) */
        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-30px);
            }
        }

        /* Animation 2: Rotate (360 degree rotation) */
        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        /* Animation 3: Glow (light shadow effect) */
        @keyframes glow {
            from {
                box-shadow: 0 0 20px #fff,
                            0 0 40px #ff00de,
                            0 0 60px #ff00de;
            }
            to {
                box-shadow: 0 0 40px #fff,
                            0 0 80px #00ffe0,
                            0 0 100px #00ffe0;
            }
        }
    </style>
</head>
<body>
    <div class="image-container">
        <img src="image(2).html" alt="Animated Image">
    </div>
</body>
</html>
